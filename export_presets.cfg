[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/gem/*.json,assets/gem/cuts/*.json,assets/materials/*.json,assets/materials/*.bin,assets/fonts/*.txt,third_party/*.txt"
exclude_filter="artifacts/*,tools/*,build/*,docs/*,.github/*,web/*,assets/gem/*.blend,assets/gem/cuts/*.blend,*.cmd,README.md"
export_path="build/PRISM.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false
codesign/enable=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/gem/*.json,assets/gem/cuts/*.json,assets/materials/*.json,assets/materials/*.bin,assets/fonts/*.txt,third_party/*.txt"
exclude_filter="artifacts/*,tools/*,build/*,docs/*,.github/*,web/*,assets/gem/*.blend,assets/gem/cuts/*.blend,*.cmd,README.md"
export_path="build/web/index.html"
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/shell.html"
html/head_include=""
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
